name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please check existing issues first. Security problems go to a private advisory (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal code sample, a StackBlitz / CodeSandbox link, or a demo URL (the demo's Viewer page accepts `?src=`). Attach a PDF if the problem is document-specific.
      render: tsx
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: React, pdfjs-dist, bundler / framework, browser and OS.
      placeholder: React 19.3, pdfjs-dist 6.3.289, Vite 8, Chrome 140 on macOS
    validations:
      required: true
