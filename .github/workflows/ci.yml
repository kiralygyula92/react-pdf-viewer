name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Only GitHub-made actions may run in this repository, so pnpm (the version in package.json's
# `packageManager`) is installed with the runner's npm rather than with pnpm/action-setup.
# The `build` job id is the status check the main branch ruleset requires: keep it, and give the
# job no `name`, or the check reports under the new name and pull requests wait forever.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package QA
        run: pnpm qa

      - name: Docs model and conformance
        run: |
          pnpm ppds:validate
          pnpm ppds:reference --check
          pnpm ppds:conformance --report conformance-report.md

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: conformance-report.md
          retention-days: 30

      - name: Install Playwright browsers
        run: pnpm --filter site exec playwright install --with-deps

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/site/playwright-report
          retention-days: 7

  react18:
    # The peer range is react >= 18: run the unit suite against React 18 too (19 runs in `build`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install with React 18
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kingtech/react-pdf-viewer add -D react@^18.3.1 react-dom@^18.3.1 @types/react@^18.3.31 @types/react-dom@^18.3.7

      - name: Typecheck
        run: pnpm --filter @kingtech/react-pdf-viewer typecheck

      - name: Unit tests
        run: pnpm --filter @kingtech/react-pdf-viewer test

  consumer-smoke:
    # Installs the packed tarball into fresh Vite and Next.js (App Router, SSR) apps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @kingtech/react-pdf-viewer build

      - name: Consumer smoke tests
        run: pnpm smoke

  visual:
    # Same image that renders the committed baselines (apps/site/scripts/visual.sh).
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      VISUAL: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Visual regression
        run: pnpm --filter site exec playwright test --project=visual

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: apps/site/playwright-report
          retention-days: 7
