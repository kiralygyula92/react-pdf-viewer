name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package QA
        run: pnpm qa

      - name: Install Playwright browsers
        run: pnpm --filter demo exec playwright install --with-deps

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/demo/playwright-report
          retention-days: 7

  react18:
    # The peer range is react >= 18: run the unit suite against React 18 too (19 runs in `ci`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install with React 18
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kiralygyula92/react-pdf-viewer add -D react@^18.3.1 react-dom@^18.3.1 @types/react@^18.3.31 @types/react-dom@^18.3.7

      - name: Typecheck
        run: pnpm --filter @kiralygyula92/react-pdf-viewer typecheck

      - name: Unit tests
        run: pnpm --filter @kiralygyula92/react-pdf-viewer test

  consumer-smoke:
    # Installs the packed tarball into fresh Vite and Next.js (App Router, SSR) apps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @kiralygyula92/react-pdf-viewer build

      - name: Consumer smoke tests
        run: pnpm smoke

  visual:
    # Same image that renders the committed baselines (apps/demo/scripts/visual.sh).
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      VISUAL: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Visual regression
        run: pnpm --filter demo exec playwright test --project=visual

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: apps/demo/playwright-report
          retention-days: 7
