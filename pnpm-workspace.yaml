packages:
  - packages/*
  - apps/*
  - content
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@types/node@22.20.2'
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
  - vite@8.3.0
# Patched versions of build-time dependencies with known advisories.
overrides:
  toml: ^4.3.0
  fflate@<0.7.5: ^0.7.5
